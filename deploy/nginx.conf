# Box Fraise Platform — nginx reverse proxy (Hardening §8)
#
# Place at /etc/nginx/sites-available/box-fraise-platform and symlink into
# sites-enabled. Reload with `sudo nginx -t && sudo systemctl reload nginx`.
#
# Three location blocks:
#   /api/notifications/stream → SSE — long timeouts, no buffering.
#   /metrics                  → internal-only (loopback allowlist).
#   /                         → everything else.

server {
    listen 80;
    server_name api.boxfraise.com;

    # All HTTP traffic upgrades to HTTPS — certbot redirect would also do
    # this but having it here keeps the rule explicit.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.boxfraise.com;

    # SSL — managed by certbot (--nginx). Replace paths if you use a
    # different CA or wildcard cert.
    ssl_certificate     /etc/letsencrypt/live/api.boxfraise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boxfraise.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Defence-in-depth: HSTS at the proxy level too. Application also sets
    # this header — duplicates are harmless and one of them surviving a
    # misconfig is better than neither.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Default proxy ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # ── SSE notifications (Hardening §7) ─────────────────────────────────────
    # Long-lived connection. Disable buffering and bump the read timeout to
    # an hour so nginx doesn't kill the stream mid-flow.
    location /api/notifications/stream {
        proxy_pass               http://127.0.0.1:8080;
        proxy_http_version       1.1;
        proxy_set_header         Connection "";
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       3600s;
        chunked_transfer_encoding on;
    }

    # ── Metrics — local only ─────────────────────────────────────────────────
    # Prometheus / Grafana Agent runs on the same host. Block public scrape
    # attempts at the proxy; the server itself doesn't authenticate /metrics.
    location /metrics {
        proxy_pass http://127.0.0.1:8080;
        allow      127.0.0.1;
        deny       all;
    }

    # Health check — quiet, no access log noise.
    location /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
